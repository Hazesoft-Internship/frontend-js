<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <input type="text" name="input" id="text" />
      <button class="add">Add todo</button>
    </div>
    <script>
      const todos = JSON.parse(localStorage.getItem("todos")) || [];

      const task = document.getElementById("text");
      const add = document.querySelector(".add");

      const addTodo = (task) => {
        const h1 = document.createElement("h1");
        h1.className = "todos";
        h1.innerText = task;
        document.querySelector(".container").appendChild(h1);
      };

      add.addEventListener("click", function () {
        todos.push(task.value);

        addTodo(task.value);

        localStorage.setItem("todos", JSON.stringify(todos));

        task.value = "";
      });

      todos &&
        todos.forEach((item) => {
          addTodo(item);
        });
    </script>
  </body>
</html>
