<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Robo Game</title>
  </head>
  <body>
    <section class="playground">
      <section class="life-container">
        <div class="person">
          <h1>Person</h1>
          <div class="life" id="person-life"></div>
        </div>
        <div class="robot">
          <h1>Robert</h1>
          <div class="life" id="robo-life"></div>
        </div>
      </section>
      <section class="display">
        <p id="robo-display"></p>
        <p id="person-display"></p>
      </section>
      <section class="attack">
        <button id="shoot">shoot</button>
        <button id="reset">reset</button>
      </section>
    </section>
    <script src="/script.js"></script>
  </body>
</html>
